plugins {
    id 'java'
}

group = 'com.alpha.training'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("io.qameta.allure:allure-maven:3.0.3")
    testImplementation("io.qameta.allure:allure-maven:3.0.3")
}

test {
    useJUnitPlatform()
}